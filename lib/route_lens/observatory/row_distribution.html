<div class="distribution-row">
  <span class="provider">{{PROVIDER}}</span>
  <div class="bar-pair" aria-label="{{PROVIDER}}: фактическая доля {{ACTUAL}}%, целевая {{TARGET}}%">
    <span class="track"><span class="fill" style="--value:{{ACTUAL}}%"></span></span>
    <span class="track"><span class="fill target" style="--value:{{TARGET}}%"></span></span>
  </div>
  <span class="bar-values">{{ACTUAL}}% / {{TARGET}}% · Δ {{DELTA}} п.п.</span>
</div>
