---
policy:
  name: balanced_v2
  precision: 6
  # Все факторы нормализованы к одной шкале (относительное положение среди
  # текущих кандидатов), поэтому вес читается как приоритет цели, а не как
  # случайный множитель над разными единицами измерения.
  weights:
    # Доли по количеству — основная цель распределения, поэтому вес наибольший.
    count_target_gain: 3.0
    volume_target_gain: 2.0
    conversion: 1.5
    # Обязательство по обороту сопоставимо с качеством: это коммерческий долг.
    turnover_obligation: 1.5
    priority: 1.0
    capacity: 1.0
    load: 1.0
    # Мягкое предпочтение суммы бинарно (0 или 1), поэтому оно намеренно слабее
    # непрерывных факторов: иначе попадание в диапазон перевешивало цель доли.
    amount_preference: 0.5
    latency: 0.5
    cost: 0.5

# Именованные пресеты показывают разные стратегии без изменения движка.
# Без --preset используется сбалансированная политика выше.
presets:
  conversion_first:
    name: conversion_first
    weights:
      conversion: 4.0
      latency: 0.5
      cost: 0.5
  cascade:
    name: cascade
    weights:
      priority: 4.0
      conversion: 0.25
  capacity_first:
    name: capacity_first
    weights:
      capacity: 3.0
      load: 2.0
      conversion: 0.5

# Это мягкие предпочтения, а не ограничения допустимости. Сумма внутри диапазона
# получает бонус, но сумма снаружи остаётся допустимой.
preferred_amount_bands:
  vipay:
    min: 50001
    max: 100000
  payflow:
    min: 500
    max: 50000
  quickpay:
    min: 100001
    max: 200000

# Целевая доля одобренного денежного объёма; вектор обязан давать в сумме 100%.
# Скоринг переводит проценты в 0..1; переданные во время запуска метрики могут
# переопределить эти цели.
volume_targets:
  vipay: 50
  payflow: 25
  quickpay: 25

# Необязательные коммерческие обязательства, изменяемые без правки Ruby-кода.
# Минимум считается от daily_approved_amount: пока оборот ниже порога, провайдер
# получает надбавку, пропорциональную недобору, а после выполнения — ровно ноль.
# Оба состояния фактора видны на публичных данных:
#   payflow  — обязательство из условия задачи, уже выполнено (2 900 000 из 3 000 000),
#              поэтому вклад равен нулю и доля payflow ничем не подпирается;
#   quickpay — обязательство не выполнено (1 100 000 при дневном лимите 8 000 000),
#              поэтому вклад положительный и растёт по мере недобора.
# Порог не должен превышать daily_amount_limit провайдера, иначе обязательство
# невыполнимо в принципе и фактор навсегда остаётся ненулевой константой.
daily_turnover_min:
  payflow: 2000000
  quickpay: 3000000

# Абсолютные эталоны на случай, когда все кандидаты неразличимы и относительная
# нормализация невозможна (например, остался один допустимый провайдер).
normalization:
  latency_reference_sec: 120
  cost_reference_pct: 2.0
  conversion_reference: 1.0

# Стратегия «по интенсивности»: лимит запросов в минуту на провайдера.
# data/providers.json — вход организаторов и остаётся байт-в-байт неизменным,
# поэтому параметры правил задаются здесь и применяются к загруженному снимку
# ДО валидации (те же числовые проверки, что и для родных полей). Неизвестный
# payment_system — ошибка запуска, а не молчаливое игнорирование.
# Значения выбраны так, чтобы не менять маршруты публичной очереди (в ней не
# более двух операций в одну минуту); на плотном потоке правило срабатывает
# и даёт skip с причиной rate_limit_exceeded.
provider_overrides:
  payflow:
    requests_per_minute_limit: 7
  quickpay:
    requests_per_minute_limit: 15
