---
policy:
  name: balanced_v2
  precision: 6
  weights:
    count_target_gain: 2.5
    volume_target_gain: 2.0
    conversion: 1.5
    priority: 1.0
    amount_preference: 1.0
    capacity: 1.0
    turnover_obligation: 1.5
    load: 1.0
    latency: 0.5
    cost: 0.5

# Именованные пресеты показывают разные стратегии без изменения движка.
# Без --preset используется сбалансированная политика выше.
presets:
  conversion_first:
    name: conversion_first
    weights:
      conversion: 4.0
      latency: 0.5
      cost: 0.5
  cascade:
    name: cascade
    weights:
      priority: 4.0
      conversion: 0.25
  capacity_first:
    name: capacity_first
    weights:
      capacity: 3.0
      load: 2.0
      conversion: 0.5

# Это мягкие предпочтения, а не ограничения допустимости. Сумма внутри диапазона
# получает бонус, но сумма снаружи остаётся допустимой.
preferred_amount_bands:
  vipay:
    min: 50001
    max: 100000
  payflow:
    min: 500
    max: 50000
  quickpay:
    min: 100001
    max: 200000

# Целевая доля одобренного денежного объёма. Скоринг переводит проценты в 0..1;
# переданные во время запуска метрики могут переопределить эти цели.
volume_targets:
  vipay: 50
  payflow: 25
  quickpay: 25

# Необязательные коммерческие обязательства, изменяемые без правки Ruby-кода.
daily_turnover_min:
  payflow: 2000000

normalization:
  latency_reference_sec: 120
  cost_reference_pct: 2.0
